name: Checks

# Runs on every pull request into main. A failed check blocks the merge
# (enforced by the "Protect main – admin approval" ruleset).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked keys and passwords (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --log-opts="origin/${{ github.base_ref }}..HEAD"

  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (Lovable projects)
        if: ${{ hashFiles('bun.lock') != '' }}
        uses: oven-sh/setup-bun@v2
      - name: Set up Node (npm projects)
        if: ${{ hashFiles('bun.lock') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build (Bun)
        if: ${{ hashFiles('bun.lock') != '' }}
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Install and build (npm)
        if: ${{ hashFiles('bun.lock') == '' }}
        run: |
          npm ci
          npm run build
      - name: Dependency audit (high/critical, informational)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=high || true
