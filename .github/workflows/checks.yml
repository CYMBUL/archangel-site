name: Checks

# Runs on every pull request into main. A failed check blocks the merge
# (enforced by the "Protect main – admin approval" ruleset).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked keys and passwords (gitleaks)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.21.2
          curl -sSfLO "$base/gitleaks_8.21.2_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_8.21.2_checksums.txt" | grep linux_x64.tar.gz | sha256sum --check
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          ./gitleaks detect --source . --redact --log-opts="origin/${{ github.base_ref }}..HEAD"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect project type
        id: kind
        run: |
          if [ -f bun.lock ]; then echo "type=bun" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then echo "type=npm" >> "$GITHUB_OUTPUT"
          else echo "type=static" >> "$GITHUB_OUTPUT"; echo "Static site: no build step needed."; fi
      - name: Set up Bun (Lovable projects)
        if: steps.kind.outputs.type == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Set up Node (npm projects)
        if: steps.kind.outputs.type == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build (Bun)
        if: steps.kind.outputs.type == 'bun'
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Install and build (npm)
        if: steps.kind.outputs.type == 'npm'
        run: |
          npm ci
          npm run build
      - name: Dependency audit (high/critical, informational)
        if: steps.kind.outputs.type == 'npm' && hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high || true
